name: 构建与发布 GHCR 镜像

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ghcr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    # 默认分支发布 latest + 北京时间版本；PR 只构建验证。
    if: >-
      github.event_name == 'pull_request' ||
      github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: 检出当前仓库
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 生成当前仓库的镜像地址与时间版本
        id: image
        shell: bash
        env:
          TZ: Asia/Shanghai
        run: |
          repository=$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/${repository}" >> "$GITHUB_OUTPUT"
          echo "version=$(date +'%Y%m%d-%H%M%S')" >> "$GITHUB_OUTPUT"

      - name: 检查 Compose 配置
        run: bash scripts/compose.sh config --quiet

      - name: 配置跨架构构建
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: 配置 Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: 登录当前仓库的 GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像标签与来源信息
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,priority=100
            type=raw,value=${{ steps.image.outputs.version }},priority=200

      - name: 构建并发布多架构镜像
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 多架构产物不会落到本机 docker，这里用同一份缓存在 amd64 上重打一次并 --load。
      # 目的只有一个：真正把容器跑起来。file 漏拷、依赖缺失这类问题构建阶段看不出来，
      # 只有启动时才炸，而用户 pull 到的就是这个炸掉的镜像。
      - name: 冒烟启动容器并检查 /api/health
        shell: bash
        run: |
          set -euo pipefail
          docker rm -f etf-smoke >/dev/null 2>&1 || true
          docker buildx build --platform linux/amd64 --load \
            --cache-from type=gha -t etf-board:smoke .
          docker run -d --name etf-smoke -p 127.0.0.1:6799:6799 etf-board:smoke
          for i in $(seq 1 45); do
            if curl -fsS --max-time 3 http://127.0.0.1:6799/api/health >/dev/null; then
              echo "health ok（第 ${i} 次探测）"
              exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' etf-smoke)" != "true" ]; then
              echo "容器已退出，日志如下："
              docker logs etf-smoke
              exit 1
            fi
            sleep 2
          done
          echo "90 秒内 /api/health 未就绪，日志如下："
          docker logs etf-smoke
          exit 1

      - name: 清理冒烟容器
        if: always()
        run: docker rm -f etf-smoke >/dev/null 2>&1 || true
